name: V2 CI

on:
  push:
    branches:
      - architecture-v2
  pull_request:
    branches:
      - main
      - architecture-v2

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
